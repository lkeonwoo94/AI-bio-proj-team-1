# 실험 설정
#
# 여기 있는 값은 "탐색 범위"이며, 실제 선택은 반드시 inner CV 안에서 이뤄진다.
# 이 파일에 최종 threshold 를 하드코딩하면 데이터 누출이다 (README §13).

seed: 42

cv:
  outer_folds: 5
  inner_folds: 5
  repeats: 1
  stratify_by: label      # outer split 은 label 기준 stratified
  # lineage 검증용 별도 split (README §15)
  lineage_scheme: group_kfold   # group_kfold | leave_one_lineage_out

# Day 1 확정: OmicsGlobalSignatures.csv 에 세 컬럼이 모두 존재한다.
# 행 단위가 세포주가 아니라 시퀀싱 프로파일이므로
# IsDefaultEntryForModel == 'Yes' 로 걸러야 ModelID 가 유일해진다.
labels:
  wgd:
    source_column: WGD
    type: binary          # 0/1 로 제공됨. 변환 불필요
    positive_is_minority: false   # WGD+ 가 65% 로 다수 클래스
  cin:
    source_column: CIN
    type: continuous      # 0 ~ 0.859
    binarize: median      # median | quantile — fold 안에서 계산
    quantile: 0.75
  loh:
    source_column: LoHFraction
    type: continuous      # 0 ~ 0.930
    binarize: median
    quantile: 0.75

features:
  # mutation matrix 앞쪽 메타 컬럼. feature 에서 반드시 제외한다.
  meta_columns:
    - "Unnamed: 0"
    - SequencingID
    - ModelID
    - ModelConditionID
    - IsDefaultEntryForModel
    - IsDefaultEntryForMC
  # hotspot(554개) 과 damaging(19,577개) 은 규모가 30배 차이난다.
  # 같은 유전자라도 의미가 다르므로 접미사를 붙여 분리 유지한다 (README §9.2).
  merge_rule: keep_separate   # keep_separate | union_or
  suffix:
    hotspot: _hotspot
    damaging: _damaging
  # 희귀 mutation 제거. 빈도는 training fold 에서만 계산한다 (README §9.3).
  min_mutation_count: 10      # 절대 개수
  min_mutation_freq: null     # 비율 기준을 쓸 경우 (둘 중 하나만)

models:
  - logistic
  - elastic_net
  - random_forest
  - xgboost
  - multitask_ann   # Nice-to-have (README §23)

panel:
  sizes: [5, 10, 20, 50]
  reference: all

metrics:
  primary: roc_auc
  report:
    - roc_auc
    - pr_auc
    - balanced_accuracy
    - sensitivity
    - specificity
    - f1
    - brier          # calibration
