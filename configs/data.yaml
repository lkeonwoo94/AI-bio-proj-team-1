# 데이터 경로 설정
#
# 데이터는 저장소 안 data/depmap/ 에 두지만 git 에는 올리지 않는다.
# 팀원끼리 경로는 공유하고 파일은 각자 받는다 (data/depmap/README.md 참고).
# data_root 는 저장소 루트 기준 상대경로이며,
# 환경변수 DEPMAP_DATA_ROOT 로 덮어쓸 수 있다.

data_root: data/depmap

# DepMap 릴리스 버전. Day 1 에서 실제 다운로드한 버전으로 확정한다.
release: TBD   # 예: 24Q2

files:
  # --- 입력 feature (RQ1~RQ3) ---
  mutation_hotspot: OmicsSomaticMutationsMatrixHotspot.csv
  mutation_damaging: OmicsSomaticMutationsMatrixDamaging.csv

  # --- 정답 label (WGD / CIN / LOH) ---
  global_signatures: OmicsGlobalSignatures.csv

  # --- 세포주 메타 (ModelID, lineage) ---
  model: Model.csv

# 병합 키와 그룹 변수
keys:
  sample_id: ModelID
  lineage: OncotreeLineage   # Model.csv 에서 확인됨

# README §7 에 따라 주 모델 입력에서 제외하는 데이터.
# 실수로 feature 에 섞이지 않도록 코드에서 명시적으로 차단한다.
excluded_from_features:
  - CNV
  - ploidy
  - gene_expression
  - TMB
